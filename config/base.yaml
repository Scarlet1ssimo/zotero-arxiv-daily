    SIMD, loop tiling, fusion, vectorization, heterogeneous computing, DSP
    compilation and code generation, processing-in-memory, compute-in-memory,
    near-memory computing, memory-centric architectures, accelerator compilation,
    compiler-architecture co-design, virtual ISA, portable ISA, target-independent
